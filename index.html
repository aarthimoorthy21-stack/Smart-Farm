<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Farm Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌱 Smart Farm Monitoring System</h1>
        <p>IoT Based Agriculture Dashboard</p>
    </header>

    <section class="dashboard">
        <div class="card">
            <h2>Soil Moisture</h2>
            <p>45%</p>
        </div>

        <div class="card">
            <h2>Temperature</h2>
            <p>28°C</p>
        </div>

        <div class="card">
            <h2>Humidity</h2>
            <p>60%</p>
        </div>

        <div class="card">
            <h2>Light Intensity</h2>
            <p>High</p>
        </div>
    </section>

    <section class="control">
        <h2>Irrigation Control</h2>
        <button>Turn ON Pump</button>
        <button class="off">Turn OFF Pump</button>
    </section>

    <footer>
        <p>© 2025 Smart Farm Project</p>
    </footer>

</body>
</html>
